
name: KBO FA 30-minute update

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram test'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search FA contracts
        run: python update_fa.py

      - name: Test Telegram
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_telegram.py

      - name: Send notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json review.json alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KBO FA data"
            git push
          fi

