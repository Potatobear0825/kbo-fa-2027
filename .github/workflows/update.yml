name: KBO FA 30-minute update
on:
  schedule:
    - cron: '0,30 * * * *' # every 30 minutes; avoids the busy top of the hour (UTC)
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram test message (true/false)'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: kbo-fa-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search new contracts (renewals and transfers)
        run: python update_fa.py
      - name: Update community rumors
        run: python update_community.py
      - name: Test Telegram connection (only if requested)
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_telegram.py
      - name: Send Telegram alerts (if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
      - name: Save dashboard and alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json review.json alert_state.json community.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KBO FA dashboard"
            git push
          fi
